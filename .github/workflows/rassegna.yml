name: Rassegna stampa quotidiana

on:
  schedule:
    - cron: "30 5 * * *"   # ogni giorno alle 05:30 UTC (06:30 o 07:30 in Italia)
  workflow_dispatch:        # permette di lanciarla a mano dal tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  genera-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera la rassegna
        run: python3 rassegna.py -o docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
